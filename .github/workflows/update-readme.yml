name: Regenerate derived fields and README

on:
  push:
    branches: [ main ]
    paths:
      - "data/**"
  workflow_run:
    workflows: ["Update from Formal Conjectures"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write

# Regeneration ends in a commit and push to `main`, so two runs in flight race
# and the loser dies on a non-fast-forward push.  Merging several PRs in quick
# succession used to produce a handful of failed runs for this reason, and if
# the *last* one lost, `main` was left with stale derived fields and no retry,
# since these commits carry [skip ci].
#
# Queue instead.  Runs are idempotent and only the final state matters, so it is
# enough that one run executes after the last push: with cancel-in-progress
# false GitHub keeps the newest pending run and discards the older ones, and
# that run sees the fully-merged tree.
concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.txt
      # `status` is derived from `informal_status`/`formal_status`, so refresh it
      # before the README is built from it.
      - run: python scripts/derive_status.py
      - run: python scripts/generate_readme.py
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/problems.yaml README.md STATISTICS.md data/statistics_history.csv data/statistics_history_*.svg
            git commit -m "chore: regenerate derived fields and README [skip ci]"
            git push
          else
            echo "No changes."
          fi
