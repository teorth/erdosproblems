name: Update forum thread counts

on:
  workflow_dispatch:

permissions:
  contents: write

# This also commits and pushes data/problems.yaml, same as the regeneration
# workflows. Share their group so a manual run cannot race one and die on a
# non-fast-forward push.
concurrency:
  group: commit-to-main
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python3 scripts/update_forum_status.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/problems.yaml

          if git diff --staged --quiet; then
            echo "🧘 No changes to commit."
          else
            git commit -m "🤖 Auto-update forum thread counts from erdosproblems.com"
            git push
          fi
