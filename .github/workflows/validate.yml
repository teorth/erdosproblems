name: Validate data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      # Needed so that validate.py can tell a direct edit of the derived
      # `status` field apart from a `status` that is merely out of date.
      - name: Checkout base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: python -m pip install -r requirements.txt

      - name: Validate data/problems.yaml
        run: python scripts/validate.py --base .base/data/problems.yaml
